# Mise Global Configuration
# Location: ~/.config/mise/config.toml
# Documentation: https://mise.jdx.dev/configuration.html

# ============================================================================
# SETTINGS
# ============================================================================
[settings]
experimental = true                 # Enable experimental features
jobs = 8                            # Parallel job count
not_found_auto_install = true       # Auto-install missing tools
task_output = "prefix"              # Output format: "prefix" | "interleave" | "quiet"
http_timeout = "30s"                # HTTP timeout for downloads
always_keep_download = false        # Keep downloads after installation
always_keep_install = false         # Keep failed installations for debugging
plugin_autoupdate_last_check_duration = "1d"
verbose = false                     # Verbose output for debugging
yes = false                         # Auto-answer yes to prompts
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go"]  # Auto-switch versions per project
trusted_config_paths = ["~/dev"]           # Skip trust prompts in dev directory

[settings.status]
missing_tools = "if_other_versions_installed"
show_env = true
show_tools = true

[settings.python]
uv_venv_auto = true                 # Auto-create/activate uv virtual environments

[settings.pipx]
uvx = true                          # Use uvx instead of pipx (faster)

# ============================================================================
# TOOLS
# ============================================================================
[tools]

# ─────────────────────────────────────────────────────────────────────────────
# PROGRAMMING LANGUAGES & RUNTIMES
# ─────────────────────────────────────────────────────────────────────────────
python = "3.12"                     # Python interpreter - pinned for stability (https://python.org)
node = "latest"                     # JavaScript runtime (https://nodejs.org)
bun = "latest"                      # Fast JavaScript runtime & toolkit (https://bun.sh)
deno = "latest"                     # Secure JavaScript/TypeScript runtime (https://deno.com)
rust = "latest"                     # Systems programming language (https://rust-lang.org)
go = "latest"                       # Google's concurrent programming language (https://go.dev)
java = "latest"                     # Enterprise programming language (https://openjdk.org)

# ─────────────────────────────────────────────────────────────────────────────
# PACKAGE MANAGERS & BUILD TOOLS
# ─────────────────────────────────────────────────────────────────────────────
uv = "latest"                       # Fast Python package installer (https://github.com/astral-sh/uv)
pdm = "latest"                      # Modern Python package manager (https://pdm.fming.dev)
pnpm = "latest"                     # Fast, disk-efficient npm alternative (https://pnpm.io)
gradle = "latest"                   # Java build automation tool (https://gradle.org)

# ─────────────────────────────────────────────────────────────────────────────
# VERSION CONTROL
# ─────────────────────────────────────────────────────────────────────────────
lazygit = "latest"                  # Git TUI interface (https://github.com/jesseduffield/lazygit)
jujutsu = "latest"                  # Modern VCS compatible with Git (https://github.com/martinvonz/jj)
jujutsu-ui = "latest"               # TUI for Jujutsu (https://github.com/noahmayr/jjui)
git-cliff = "latest"                # Changelog generator from Git history (https://git-cliff.org)
git-lfs = "latest"                  # Git Large File Storage (https://git-lfs.com)
graphite = "latest"                 # Stacked PRs workflow tool (https://graphite.dev)
delta = "latest"                    # Syntax-highlighting pager for git diffs (https://dandavison.github.io/delta)
difftastic = "latest"               # Structural diff tool (https://difftastic.wilfred.me.uk)

# ─────────────────────────────────────────────────────────────────────────────
# CI/CD & DEVOPS
# ─────────────────────────────────────────────────────────────────────────────
act = "latest"                      # Run GitHub Actions locally (https://github.com/nektos/act)
argocd = "latest"                   # Kubernetes GitOps continuous delivery (https://argo-cd.readthedocs.io)
helm = "latest"                     # Kubernetes package manager (https://helm.sh)
terraform = "latest"                # Infrastructure as Code tool (https://terraform.io)
ansible = "latest"                  # IT automation platform (https://ansible.com)
buildpack = "latest"                # Cloud Native Buildpacks CLI (https://buildpacks.io)
trunk = "latest"                    # Meta linter & DevEx toolkit (https://trunk.io)

# ─────────────────────────────────────────────────────────────────────────────
# CONTAINERS & VIRTUALIZATION
# ─────────────────────────────────────────────────────────────────────────────
lima = "latest"                     # Linux VMs on macOS (https://lima-vm.io)
colima = "latest"                   # Container runtimes on macOS (https://github.com/abiosoft/colima)
podman = "latest"                   # Daemonless container engine (https://podman.io)
talos = "1.11.5"                    # Kubernetes OS (https://talos.dev)
talosctl = "1.11.5"                 # CLI for Talos Linux

# ─────────────────────────────────────────────────────────────────────────────
# AI & CODE ASSISTANTS
# ─────────────────────────────────────────────────────────────────────────────
