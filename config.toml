tlrc = "latest"                     # Rust tldr client - simplified man pages (https://github.com/tldr-pages/tlrc)
grex = "latest"                     # Regex generator from examples (https://github.com/pemistahl/grex)
hyperfine = "latest"                # Command-line benchmarking (https://github.com/sharkdp/hyperfine)
