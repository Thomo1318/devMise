"npm:copilot" = "latest"            # GitHub Copilot CLI
"npm:exa-mcp-server" = "latest"     # Exa search MCP server
"npm:git-tip" = "latest"            # Random Git tips
"npm:pm2" = "latest"                # Node.js process manager (https://pm2.keymetrics.io)
"npm:concurrently" = "latest"       # Run multiple commands concurrently
"npm:@xyflow/react" = "latest"      # React Flow diagram library (https://reactflow.dev)
"npm:llamaindex" = "latest"         # LlamaIndex JS SDK (https://llamaindex.ai)

# ─────────────────────────────────────────────────────────────────────────────
# PIPX TOOLS (Python CLI Applications)
# ─────────────────────────────────────────────────────────────────────────────
"pipx:aider-install" = "latest"     # Aider AI pair programming installer
"pipx:ocrmypdf" = "latest"          # OCR for PDFs (https://ocrmypdf.readthedocs.io)
"pipx:fixit" = "latest"             # Python auto-fixing linter
"pipx:pytest" = "latest"            # Python testing framework (https://pytest.org)
"pipx:pyinstaller" = "latest"       # Python executable builder (https://pyinstaller.org)
"pipx:llama-index" = "latest"       # LlamaIndex Python SDK (https://llamaindex.ai)
"pipx:mcpm" = "latest"              # MCP server manager

# ============================================================================
# ENVIRONMENT VARIABLES (Optional)
# ============================================================================
# [env]
# EDITOR = "micro"
# MISE_GLOBAL = "true"

# ============================================================================
# TRUSTED CONFIGURATION PATHS (Optional)
# ============================================================================
# [settings.trusted_config_paths]
# paths = ["~/dev", "~/work", "~/projects"]

# ============================================================================
# UV TOOL INSTALLATIONS (Manual - not managed by mise)
# ============================================================================
# These tools are installed via `uv tool install` and tracked here for documentation
# Run: mise run sync-uv-tools | update-uv-tools | list-uv-tools
#
# Currently tracked:
# - cronboard: Cron job monitoring dashboard
# - aider-chat: AI pair programming
# - Faker: Test data generator
# - ocrmypdf: OCR for PDFs
# - ruff: Fast Python linter

[tasks.sync-uv-tools]
description = "Install/sync all uv tools"
run = """
echo "Installing uv tools..."
uv tool install git+https://github.com/antoniorodr/cronboard
echo "✓ All uv tools installed"
"""

[tasks.update-uv-tools]
description = "Update all uv tools to latest versions"
run = """
echo "Updating all uv tools..."
uv tool upgrade --all
echo "✓ All uv tools updated"
"""

[tasks.list-uv-tools]
description = "List all installed uv tools"
run = "uv tool list"
